const RULES=`<h2>SQUIRE: Tournament of Banners</h2><p><i>A poker-inspired tournament for 2 to 6 players. Win trophies and build your scorecard.</i></p>
<h3>Each day</h3><p>You are dealt 10 cards. The day has five events: <b>Archery</b> (play 2 cards, no community cards), <b>Sword Fight</b> (3 community cards come out; play 2), <b>Joust</b> (a 4th community card; play 2), <b>Grand Melee</b> (a 5th; play 2) and <b>Champion</b> (play 1 card: only what it makes with the community cards counts). Everyone plays at the same time, then reveals. The best poker hand wins the event. You play 9 cards a day and keep 1 for the next day. The game lasts 4 days.</p>
<h3>Trophies, crowns and boons</h3><ul><li><b>Trophy:</b> win an event and you take its trophy.</li><li><b>Crown:</b> a new noble (the favor banner) comes out each day, watching one event. Whoever best meets the noble's objective at that event wins its crown. A crown is a trophy of its own kind.</li><li><b>Boon:</b> lose an event but still play <b>a pair at Archery</b>, <b>two pair or better</b> at the Sword Fight, Joust or Grand Melee, or a <b>pair at Champion</b> (your card matches a community card), and you earn a boon. Completing your secret objective also earns a boon.</li></ul>
<h3>Your scorecard</h3><p>Six banner columns, each a bottom box with 3 rows above it, worth more toward the right.</p><ul><li>Each column belongs to the first kind of trophy placed in it.</li><li>A trophy of a kind you already have goes up its own column. A new kind goes into the next empty bottom box, or on top of a column that only holds boons.</li><li>A boon can go into the next empty bottom box or on top of any column.</li><li>If a trophy's column is full, it still scores its 1 point.</li></ul>
<h3>Scoring</h3><ul><li><b>1 point</b> for every trophy and crown you win.</li><li><b>Each column</b> pays the value of its <b>highest trophy</b>. Boons above it pay nothing, so a boon only pays off if you win that event again later.</li><li><b>Variety:</b> 2 kinds +1, 3 kinds +2, 4 kinds +3, 5 kinds +5, 6 kinds +7.</li></ul><p>The highest total wins. Ties: more trophies, then more board points.</p>
<h3>Tie-breaks</h3><p>Each day's noble card shows a suit order, best to worst (also shown on the field as <i>Ties</i>). It breaks ties all day: for exactly tied hands in an event, or for the noble's crown, compare the suits of the played cards, highest rank first.</p>
<h3>Secret objectives</h3><p>You may be dealt objectives and keep one secret. Complete it and you earn a boon.</p>`;
const ONLINE_RULES=`<h3>Playing online</h3><ul><li><b>Create a game</b> to get a 4-letter room code, then share the code or the invite link. Friends tap <b>Join</b> and enter it.</li><li>The host picks the table size (2 to 6). Empty seats are filled with bots when the host starts.</li><li>Everyone chooses cards at the same time and taps <b>Lock in</b>. You can change your cards until the last player locks in; then all cards are revealed together.</li><li>After each reveal everyone taps <b>Continue</b>; the next event starts when all connected players are ready.</li><li>If you lose connection, just reopen the page: you'll rejoin your seat. If a friend leaves for good, the host can hand their seat to a bot.</li></ul>`;

/* ---------- actions ---------- */

function pick(i){if(Date.now()-dragAt<400||!G||G.phase!='pick')return;if(TUT&&!tutMayTap(order[i]))return;const p=myP();if(p.sel||needOb(G,p))return;const k=order[i],j=sel.indexOf(k);if(j>=0)sel.splice(j,1);else if(sel.length<EV[G.ev][1])sel.push(k);render()}

function canSwitchOb(){const h0=myP();return G&&G.phase=='pick'&&!G.hist.length&&!h0.rf&&h0.ob!=null&&h0.oc&&h0.oc.length>1}

function buildHTML(){let h='';
  if(!connected&&!TUT&&!OFFLINE)h+=`<div class="conn">${S?'Connection lost. Reconnecting…':'Connecting to the SQUIRE server…'}</div>`;
  if(!S)h+=homeHTML();else if(!G)h+=lobbyHTML();else h+=gameHTML();return h}
/* keep my played cards clear of the trophy + community row: lift the row into free space, then make the table taller (fit-to-screen zooms if needed) */
function fixTable(){const t=document.querySelector('.tbl'),me=t&&t.querySelector('.spot.me .cs'),c=t&&t.querySelector('.ctr');if(!me||!c)return;
  const R=e=>e.getBoundingClientRect(),parts=[...c.querySelectorAll('.tro1,.cm .row')].map(R);if(!parts.length)return;
  const U={l:Math.min(...parts.map(r=>r.left)),r:Math.max(...parts.map(r=>r.right)),t:Math.min(...parts.map(r=>r.top)),b:Math.max(...parts.map(r=>r.bottom))};
  let lim=R(t).top+6;t.querySelectorAll('.pseat,.spot:not(.me),.deckpile').forEach(e=>{const r=R(e);if((r.top+r.bottom)/2<U.t&&r.right>U.l&&r.left<U.r)lim=Math.max(lim,r.bottom+4)});
  const dn=Math.ceil(lim-U.t);if(dn>0){c.style.top=(parseFloat(c.style.top)+dn)+'px';U.t+=dn;U.b+=dn;const sp=me.parentNode;sp.style.top=(parseFloat(sp.style.top)+dn)+'px';t.style.height=(parseFloat(t.style.height)+dn)+'px'}
  let over=Math.max(U.b,R(c).bottom)+6-R(me).top;if(over<=0)return;
  const up=Math.min(over,Math.max(0,Math.floor(U.t-lim)));if(up){c.style.top=(parseFloat(c.style.top)-up)+'px';over-=up}
  if(over>0){const sp=me.parentNode;over=Math.ceil(over);sp.style.top=(parseFloat(sp.style.top)+over)+'px';t.style.height=(parseFloat(t.style.height)+over)+'px'}}
/* the reveal moment: a big WINNER next to the event winner and a big crown next to each noble winner, then they fade away */
let lastReveal='';
function revealPops(){if(!G||G.phase!='show')return;const key=G.wave+'-'+G.ev+'-'+G.hist.length;if(key==lastReveal)return;lastReveal=key;
  document.querySelectorAll('.rpop,.rshade').forEach(e=>e.remove());
  const at=i=>{const e=document.querySelector(`[data-p="${i}"]`);if(!e)return null;const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,r}};
  const add=(cls,html,x,y)=>{const d=document.createElement('div');d.className='rpop '+cls;d.innerHTML=html;
    d.style.left=Math.max(110,Math.min(innerWidth-110,x))+'px';d.style.top=Math.max(cls=='win'?100:60,Math.min(innerHeight-(cls=='win'?100:60),y))+'px';document.body.appendChild(d);const hw=d.offsetWidth/2+8,hh=d.offsetHeight/2+8;d.style.left=Math.max(hw,Math.min(innerWidth-hw,x))+'px';d.style.top=Math.max(hh,Math.min(innerHeight-hh,y))+'px';setTimeout(()=>d.remove(),4000)};
  const sh=document.createElement('div');sh.className='rshade';document.body.appendChild(sh);setTimeout(()=>sh.remove(),4000);
  const w=at(G.win);if(w){const P=G.P[G.win],hd=handDesc(P.pl,G.ks[G.win],G.ev);add('win',`<div class="rib"><i>🏆</i>${G.win==G.me?'You win!':'Winner'}</div><div class="rwc"><div class="rcs">${P.pl.map(c=>cd(c)).join('')}</div><b>${G.win==G.me?'':esc(P.n)+': '}${hd.charAt(0).toUpperCase()+hd.slice(1)}</b></div>`,w.x,w.y)}
  const by={};(G.ncl||[]).forEach(c=>by[c.p]=(by[c.p]||0)+c.v);
  G.P.forEach((q,i)=>{const nb=(q.gt||[]).filter(x=>x.k=='B').length;if(!nb)return;const a=at(i);if(a)add('bn',`⚜<b>${i==G.me?'You':esc(q.n)}: boon${nb>1?' ×'+nb:''}</b>`,a.x+(i==G.win?0:0),a.y+(i==G.me?-70:30))});
  Object.keys(by).forEach(p=>{const a=at(+p);if(!a)return;const same=+p==G.win;add('crn',`👑<b>${+p==G.me?'Your':esc(G.P[p].n)+'\'s'} crown</b>`,a.x+(same?(a.x<innerWidth/2?90:-90):0),a.y+(same?40:0))})}
function render(){const app=document.getElementById('app');
  app.className=TUT?'tut hl-'+(tutStep().hl||''):'';document.documentElement.classList.toggle('onhome',!S&&!TUT);app.style.zoom='';FIT_SHRINK=0;app.innerHTML=buildHTML();fixTable();
  if(G&&G.phase!='end'){const de=document.documentElement,avail=viewH();let over=de.scrollHeight-avail;
    if(over>0){FIT_SHRINK=over;app.innerHTML=buildHTML();fixTable();over=de.scrollHeight-avail}
    if(over>0){let z=Math.max(0.6,avail/de.scrollHeight);app.style.zoom=z.toFixed(3);
      for(let t=0;t<4&&z>0.6&&de.scrollHeight>avail;t++){z=Math.max(0.6,z*avail/de.scrollHeight-0.004);app.style.zoom=z.toFixed(3)}}}
  if(G)dragSetup();if(TUT)tutAfterRender();revealPops()}

function arenaHTML(T){const g=G,e=EV[g.ev],ph=g.phase,k=e[1],me=g.me,host=isHost(),h0=g.P[me];
  const others=g.P.map((_,i)=>(me+1+i)%g.n).slice(0,g.n-1);
  const fan=n=>{const m=Math.min(n,6);return `<div class="fan">${Array.from({length:m},(_,q)=>`<i style="--r:${((q-(m-1)/2)*13).toFixed(0)}deg"></i>`).join('')}<b>${n}</b></div>`};
  const seats=others.map(i=>{const p=g.P[i],off=!p.bot&&!online(i),win=ph=='show'&&i==g.win;
   const stat=ph!='pick'||p.bot?'':p.locked?'ready':off?'offline':'choosing';
   const mid=ph=='show'?`<div class="scs">${p.pl.map(c=>cd(c,'flip')).join('')}</div>`:(p.locked||p.bot)&&ph=='pick'?`<div class="scs">${Array(k).fill('<span class="c tb"></span>').join('')}</div>`:fan(p.hc);
   return `<div data-p="${i}" class="oseat ${win?'win':''} ${off?'off':''}" style="--pc:${PC[i]}" onclick="zoomB(${i})">${mid}<div class="plate">${chip(i)}<b>${esc(p.n)}</b></div><div class="pm">${HZ.sqScore(g,i)} pts · ${p.tr.length+(p.cr||0)}🏆 ${(p.bn||0)}⚜${stat?' · '+stat:''}</div>${ph=='show'?`<div class="hn2">${hname(g.ks[i],g.ev)}${win?' 🏆':''}</div>`:''}${host&&off&&ph!='end'?`<button class="b sm" onclick="event.stopPropagation();send({t:'botify',seat:${i}})">Bot plays</button>`:''}</div>`}).join('');

function tutNext(){const st=tutStep();if(st.a=='next'){if(st.nobleIntro)TUT.nobleIntro=true;else TUT.stage++;render()}else if(st.a=='cont')send({t:'cont'})}
function tutChoose(i){const o=tutStep().o[i];sel=o.c.map(C).map(ck);render()}
function tutMayTap(k){const st0=tutStep();if(st0.nobleIntro&&G.phase=='pick'){TUT.nobleIntro=true;return true}if(st0.a=='choose'&&!st0.o.some(o=>o.c.map(C).some(c=>ck(c)==k))){toast('Pick one of the three choices in the herald\'s box.');return false}if(!tutAllowed()){toast('Read the herald first, then tap '+(tutStep().a=='cont'?'Continue':'Next')+'.');return false}return true}
function tutCls(c){if(!TUT)return'';const st=tutStep();if(st.a=='choose')return st.o.some(o=>o.c.map(C).some(x=>HZ.same(x,c)))?' tglow':' tdim';return tutAllowed()||st.nobleIntro?'':' tdim'}
function tutSend(m){const g=TUT.g,st=tutStep();
  if(m.t=='play'&&st.a=='choose'&&!st.o.some(o=>o.c.length==m.cards.length&&o.c.map(C).every(w=>m.cards.some(c=>HZ.same(c,w))))){toast('Pick one of the three choices in the herald\'s box.');return}
  if(m.t=='play'&&(st.a=='play'||st.a=='choose')){if(!HZ.play(g,0,m.cards)){toast('Those cards can\'t be played right now.');return}
    TUT.ch[g.ev]=m.cards.map(TSTR);HZ.reveal(g);sel=[];tutView();render()}
  else if(m.t=='unplay'){HZ.unplay(g,0);tutView();render()}
  else if(m.t=='cont'&&st.a=='cont'){if(g.ev==4){TUT.done=true;tutView();render();return}const before=g.comm.length;HZ.nxt(g);if(g.comm.length>before){TUT.commFrom=before;TUT.deckVis=true}tutOppReady();tutView();render()}
  else if(m.t=='leave')exitTut()}
/* tutorial: standalone "Win trophies" screen (no table) */
function trophyLesson(T){const ex=['10♥','J♦','Q♠','K♣','A♦'].map(C),pts=G.cfg.hp[4];
  return `<div class="coach tpop"><div class="tl-k">Win trophies</div><p class="tl-p">Every event has one trophy card on the <b>gold stand</b> in the middle of the table (glowing below). Win the event and the trophy is yours to keep.</p>
  <div class="tend"><div class="tl-k dk">At the end of the game</div><div class="tend-row">${ex.map(c=>cd(c,HZ.same(c,T)?'mine':'')).join('')}</div>
  <div class="tend-r">Straight = ${pts} points!</div><p>Your best five trophies make a poker hand. The better the hand, the more points you score.</p></div>
  <div class="tgot"><button class="b" onclick="tutNext()">Got it</button></div></div>`}
function coachHTML(){const st=tutStep();let btn='';if(st.pop=='trophy')return trophyLesson(TRO(G));
  if(st.a=='next')btn=st.deal&&!TUT.dealDone?'<button class="b" disabled>Dealing…</button>':'<button class="b" onclick="tutNext()">Next</button>';
  else if(st.a=='cont')btn='<button class="b" onclick="tutNext()">Continue</button>';
  else if(st.a=='end')btn=TUT.seenEx?'<button class="b" onclick="exitTut();solo()">Play a practice game</button><button class="b ghost" onclick="exitTut()">Back to home</button>':'<button class="b" onclick="tutScoreEx(1)">How a full game is scored</button>';
  const opts=st.a=='choose'?`<div class="copts">${st.o.map((o,i)=>{const on=o.c.length==sel.length&&o.c.map(C).every(c=>sel.includes(ck(c)));return `<button class="b cop ${on?'on':''}" onclick="tutChoose(${i})">${o.l}</button>`}).join('')}</div>`:'';
  return `<div class="coach"><div class="ch"><span class="cht">${st.t}</span></div><p>${st.x}</p>${opts}${btn?`<div class="cb">${btn}</div>`:''}</div>`}
const TUT_EX=[
 {n:'You',tr:['Q♥','Q♣','10♦','10♠'],cr:[3,3,2,2],me:1},
 {n:'Lady Ada',tr:['K♥','K♠','K♦','A♣','A♥'],cr:[3]},
 {n:'Sir Roland',tr:['10♣','J♦','Q♠','K♣','A♦'],cr:[]}];
function tutScoreEx(o){let d=document.getElementById('rules');if(!d){d=document.createElement('div');d.id='rules';document.body.appendChild(d)}
  if(!o){d.innerHTML='';d.style.display='none';if(TUT){TUT.seenEx=true;render()}return}
  const hp=G.cfg.hp,rows=TUT_EX.map(x=>{const cs=x.tr.map(C),k=HZ.best(cs)[0],h=hp[k],c=x.cr.reduce((a,b)=>a+b,0);return Object.assign({cs,k,h,c,t:h+c},x)}).sort((a,b)=>b.t-a.t);
  d.innerHTML=`<div class="rp ex"><h2>How a full game is scored</h2><p>After four waves, your best five trophies score as a poker hand. Add 👑 points from the nobles you claimed: the first claim on a noble is worth 3, the second 2, and then a new noble takes its place. Here is an example finish:</p>${rows.map((r,i)=>`<div class="res2 ${i?'':'win'}"><div class="rh"><span class="rk">${i+1}</span><b>${r.n}</b><span class="rt">${r.t} pts</span></div><div class="rc">${r.cs.map(c=>cd(c)).join('')}</div><div class="rd">${r.cs.length} trophies: ${HN[r.k].toLowerCase()} +${r.h}${r.c?` · ${r.cr.map(v=>'👑'+v).join(' ')} nobles +${r.c}`:' · no crowns'}</div></div>`).join('')}<p><b>You won with only 4 trophies.</b> Two pair is worth just 4 points, but four noble claims added 10. Sir Roland's straight and Lady Ada's full house were stronger hands, with fewer crowns. Trophies and crowns both count, so chase whichever the cards give you.</p><button class="b" onclick="tutScoreEx(0)">Got it</button></div>`;
  d.style.display='block';d.scrollTop=0;const pn=d.querySelector('.rp'),ph=pn.getBoundingClientRect().height+20,av=viewH();if(ph>av)pn.style.zoom=Math.max(.6,av/ph).toFixed(3)}
function tutAfterRender(){const st=tutStep();
  if(st.deal&&!TUT.dealStarted){TUT.dealStarted=true;runDeal()}
  if(TUT.commFrom!=null){const f=TUT.commFrom;TUT.commFrom=null;animComm(f)}}
const RMO=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function deckXY(){const d=document.querySelector('.deckpile');if(!d)return null;const r=d.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function flyBack(from,tgt,done){const r=tgt.getBoundingClientRect(),f=document.createElement('div');f.className='flyc';f.style.left=(from.x-18)+'px';f.style.top=(from.y-25)+'px';document.body.appendChild(f);
  const dx=r.left+r.width/2-from.x,dy=r.top+r.height/2-from.y;
  const a=f.animate([{transform:'translate(0,0) rotate(0deg) scale(.9)'},{transform:`translate(${dx}px,${dy}px) rotate(${dx>0?10:-10}deg) scale(1.05)`}],{duration:430,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
  a.onfinish=()=>{f.remove();done()}}
function runDeal(){const finish=()=>{TUT.dealt=10;TUT.oppDealt=10;TUT.dealDone=true;TUT.deckVis=false;render()};
  if(RMO()||!deckXY())return finish();
  for(let q=0;q<20;q++){const me=q%2==0,idx=q>>1;
    setTimeout(()=>{if(!TUT||TUT.dealDone)return;const from=deckXY(),tgt=me?document.querySelectorAll('.hand .c')[idx]:document.querySelector('.pseat .plate');
      if(!from||!tgt)return;
      flyBack(from,tgt,()=>{if(!TUT||TUT.dealDone)return;if(me)TUT.dealt=Math.max(TUT.dealt,idx+1);else TUT.oppDealt=Math.max(TUT.oppDealt,idx+1);
        if(TUT.dealt>=10&&TUT.oppDealt>=10)return finish();render()})},250+q*130)}}
function animComm(from){const d=deckXY(),els=[...document.querySelectorAll('.ctr .cm .c:not(.ph)')].slice(from);
  if(RMO()||!d||!els.length){TUT.deckVis=false;return render()}
  els.forEach((el,j)=>{const r=el.getBoundingClientRect(),dx=d.x-(r.left+r.width/2),dy=d.y-(r.top+r.height/2);
    el.animate([{transform:`translate(${dx}px,${dy}px) scale(.55)`,opacity:.3},{transform:'none',opacity:1}],{duration:520,delay:300+j*260,easing:'cubic-bezier(.2,.7,.3,1)',fill:'backwards'})});
  setTimeout(()=>{if(TUT){TUT.deckVis=false;render()}},300+els.length*260+700)}
addEventListener('resize',()=>{if(G)render()});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(G)render()});
try{document.documentElement.style.setProperty('--back',`url("${BACK}")`)}catch(_){}
render();if(!OFFLINE)connect();
</script></body></html>
