<script>
const {SU,COL,RK,EV,HN,OBJ,cmp,best,bestCards,hname,nq,NV,TRO,npts,hpts,ach,obv,obp,needOb,ranking}=HZ;
const PC=['#ffd24a','#ff6b6b','#5bc0ff','#7be07b','#c58cff','#ffa94d'],STI=['🏹','⚔️','🐎','🛡️','👑'];
const RULES=`<h2>HUZZAH! The Tournament of Champions</h2><p><i>A poker-inspired card game of timing and hand management. 2 to 6 players.</i></p><p><b>5 or 6 players:</b> the Yellow ✦ suit is added to the playing deck (65 cards), and Yellow appears in every suit tie-break order. The rules are otherwise the same.</p><h3>Goal</h3><p>Win trophy cards across four waves and claim spots on noble cards. At the end your best five-card trophy hand scores points, and your noble points are added.</p><h3>Setup</h3><p>Wave 1: each player gets 10 hidden cards from a 52-card deck. The 20 trophy cards (10, J, Q, K, A in four suits) are set out by event: <b>Archery awards the 10, Sword Fight the Jack, Joust the Queen, Grand Melee the King, and Champion the Ace</b>. Every rank appears once in each suit, and the suits are shuffled across the four days at the start, so each day's trophies are a mix of suits. The field shows the trophies for the current day and past days; future days stay hidden until they start. Two noble cards are dealt face-up, each with a different event and a different objective.</p><h3>A wave: five events</h3><ol><li><b>Archery:</b> play 2 cards (your pocket), compare the 2-card hands.</li><li><b>Sword Fight:</b> 3 community cards. Play 2; best 5 from your 2 + the board.</li><li><b>Joust:</b> 4th community card. Play 2; best 5 of 6.</li><li><b>Grand Melee:</b> 5th community card. Play 2; best 5 of 7.</li><li><b>Champion:</b> play 1 card; best 5 of 6.</li></ol><p>The winner of each event takes its trophy. You play 9 cards a wave, so <b>one card is left over and you keep it</b> for the next wave: each new wave you are dealt 9 fresh cards to join it (no duplicates). Choose carefully what to hold back.</p><h3>Nobles</h3><p>Each noble card has an event, an objective, and 2 spots worth 4 and 2 points (the first claim gets 4). When that event is played, the single player whose pocket (the card or cards they play) best meets the objective places a token on the next open spot (the 5 first). It happens in addition to the trophy, so one player can win both. If nobody qualifies, nothing is claimed. When both spots are full, the noble is exhausted and a new one is dealt, always with an event and an objective not already used by the other noble.</p><ul><li><b>Lowest pair:</b> your 2 cards are a pair; the lowest pair wins.</li><li><b>Biggest gap:</b> the largest rank difference between your 2 cards.</li><li><b>Number cards adding to 10:</b> two cards from 2 to 10 that add up to 10 (8+2, 7+3, 6+4, 5+5); the highest card wins.</li><li><b>Highest consecutive:</b> two cards of consecutive ranks; the highest top card wins.</li><li><b>Highest Spade / Heart, Lowest Diamond:</b> among your pocket cards of that suit.</li><li><b>Best 3-card straight:</b> any three consecutive ranks among your pocket + the community cards, using one or two of your pocket cards (at least one); the highest straight wins.</li></ul><p>Ties on a noble: compare the suits of your qualifying cards, highest rank first, using the suit order printed on the noble (top is best; Yellow is skipped when it isn't in play). For a 3-card straight, all three cards of the straight count.</p><h3>Secret objectives</h3><p>At the start each player is dealt 2 objective cards and keeps 1 secret (you can switch until the first reveal). Your hand stays face down until you've picked. An objective is met if you win the described event: by wave (day 1 or 3 means either wave 1 or wave 3), or with the described hand. Poker-hand objectives use the winning five-card hand in that event. Met objectives score their points at the end. Bots keep a random one. The host can turn objectives off in Playtest settings.</p><p><b>Variant, objective refills</b> (Playtest settings): when you complete your objective it scores right away and you're dealt new ones (same number as the starting deal) and keep 1. You only get objectives that can still be won, and only events after you take it count. <i>Once per player</i> allows one refill; <i>Unlimited</i> refills every time.</p><p><b>Setup options:</b> the host can set how many nobles are in play (0 to 3) and how many objectives each player is dealt (0 to 3) in Playtest settings.</p><h3>Final scoring</h3><p>After wave 4, choose your best five trophy cards (normal poker). Score = <b>hand points + noble points + your secret objective(s)</b>. Hand points (provisional): high card 0, pair 2, two pair 4, three of a kind 6, straight 8, flush 10, full house 12, four of a kind 14, straight flush 16, royal flush 18. The highest total wins. The host can switch to "best hand wins, nobles only break ties" in Playtest settings. Further ties: better hand, then the suit order on the last trophy.</p><h3>Tie-breaks in an event</h3><p>Every trophy has its own suit order, starting with its own suit. For exactly tied hands in an event, compare the suits of the played cards, highest rank first, using that trophy's order.</p><h3>Playtest build notes</h3><ul><li>Archery: a pair beats no pair, then high cards.</li><li>Bots save strong cards for later events and go for nobles when they can.</li><li>Ace counts high only for straights and consecutive pairs (except the 3-card wheel A-2-3).</li><li>Tap a noble to enlarge it and read its card. Tap your objective chip to see your objective.</li></ul>`;
const ONLINE_RULES=`<h3>Playing online</h3><ul><li><b>Create a game</b> to get a 4-letter room code, then share the code or the invite link. Friends tap <b>Join</b> and enter it.</li><li>The host picks the table size (2 to 6). Empty seats are filled with bots when the host starts.</li><li>Everyone chooses cards at the same time and taps <b>Lock in</b>. You can change your cards until the last player locks in; then all cards are revealed together.</li><li>After each reveal everyone taps <b>Continue</b>; the next event starts when all connected players are ready.</li><li>If you lose connection, just reopen the page: you'll rejoin your seat. If a friend leaves for good, the host can hand their seat to a bot.</li></ul>`;

/* ---------- local state ---------- */
const LS={get(){try{return JSON.parse(localStorage.getItem('hz')||'{}')}catch(_){return {}}},set(v){try{localStorage.setItem('hz',JSON.stringify(Object.assign(LS.get(),v)))}catch(_){}},del(k){try{const o=LS.get();delete o[k];localStorage.setItem('hz',JSON.stringify(o))}catch(_){}}};
let S=null,G=null,ws=null,connected=false,wantRoom=null,order=[],sel=[],toastT=0,homeMode=null,setOpen=false,soloSize=4;
const qs=new URLSearchParams(location.search);const inviteCode=(qs.get('room')||'').toUpperCase().slice(0,4);
let jcode=inviteCode;
const ck=c=>c.s+'-'+c.r;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- connection ---------- */
let retry=0;
function connect(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{connected=true;retry=0;const s=LS.get();if(s.code&&s.token)send({t:'rejoin',code:s.code,token:s.token});render()};
  ws.onclose=()=>{connected=false;render();setTimeout(connect,Math.min(8000,600*(++retry)))};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t=='joined'){LS.set({code:m.code,token:m.token});history.replaceState(null,'',location.pathname)}
    else if(m.t=='state'){S=m;G=m.g;syncHand();render()}
    else if(m.t=='error')toast(m.msg);
    else if(m.t=='gone'){LS.del('code');LS.del('token');S=null;G=null;render()}
    else if(m.t=='kicked'){LS.del('code');LS.del('token');S=null;G=null;toast(m.msg);render()}};
}
const send=m=>{if(ws&&ws.readyState==1)ws.send(JSON.stringify(m));else toast('Still connecting… try again in a moment.')};
function toast(t){let d=document.getElementById('toast');if(!d){d=document.createElement('div');d.id='toast';d.className='toast';document.body.appendChild(d)}d.textContent=t;d.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>d.style.display='none',3500)}

/* ---------- my hand (local order + selection) ---------- */
function myP(){return G&&G.P[G.me]}
function syncHand(){const p=myP();if(!p||!p.hand){order=[];sel=[];return}
  const ks=p.hand.map(ck);order=order.filter(k=>ks.includes(k)).concat(ks.filter(k=>!order.includes(k)));
  if(p.sel)sel=p.sel.map(ck);else sel=sel.filter(k=>ks.includes(k));
  if(G.phase!='pick')sel=[]}
const handCards=()=>{const p=myP(),m={};p.hand.forEach(c=>m[ck(c)]=c);return order.map(k=>m[k])};
const selCards=()=>{const p=myP(),m={};p.hand.forEach(c=>m[ck(c)]=c);return sel.map(k=>m[k]).filter(Boolean)};

/* ---------- actions ---------- */
function myName(){const v=(document.getElementById('nm')||{}).value;const n=(v!=null?v:LS.get().name||'').trim();if(v!=null)LS.set({name:n});return n}
function create(){const n=myName();if(!n)return needName();send({t:'create',name:n})}
function solo(){const n=myName()||'You';send({t:'solo',name:n,size:soloSize})}
function join(){const n=myName();if(!n)return needName();const c=(document.getElementById('jc').value||'').trim().toUpperCase();if(c.length!=4)return toast('Enter the 4-letter room code.');send({t:'join',code:c,name:n})}
function needName(){toast('Enter your name first.');const e=document.getElementById('nm');if(e)e.focus()}
function leave(){if(G&&G.phase!='end'&&!confirm('Leave this game? A bot will take over your seat.'))return;send({t:'leave'});LS.del('code');LS.del('token');S=null;G=null;render()}
function pick(i){if(Date.now()-dragAt<400||!G||G.phase!='pick')return;const p=myP();if(p.sel||needOb(G,p))return;const k=order[i],j=sel.indexOf(k);if(j>=0)sel.splice(j,1);else if(sel.length<EV[G.ev][1])sel.push(k);render()}
function lockIn(){if(sel.length!=EV[G.ev][1])return;send({t:'play',cards:selCards().map(c=>({s:c.s,r:c.r}))})}
function unlock(){send({t:'unplay'})}
function pickObj(k){send({t:'obj',k})}
function cont(){send({t:'cont'})}
function setCfg(k,v){const c={};c[k]=v;send({t:'cfg',cfg:c})}
function setHP(i,v){const a=S.room.cfg.hp.slice();a[i]=+v||0;setCfg('hp',a)}
function setOV(i,v){const a=S.room.cfg.obv.slice();a[i]=+v||0;setCfg('obv',a)}
function invite(){const url=location.origin+'/?room='+S.room.code,txt='Join my HUZZAH! game. Room code '+S.room.code;
  if(navigator.share)navigator.share({title:'HUZZAH!',text:txt,url}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt+': '+url).then(()=>toast('Invite link copied'),()=>prompt('Copy this link',url));
  else prompt('Copy this link',url)}

/* ---------- card drawing ---------- */
const cd=(c,cls='',oc='')=>{const k=ck(c),a=ART[k]||(c.s==4?NIMG[k]:null);return `<span class="c ${a?'art':''} ${cls}${oc?' tap':''}" style="color:${COL[c.s]}" ${oc?`onclick="${oc}"`:''}>${a?`<img src="${a}" alt="${RK[c.r]}${SU[c.s]}">`:`<b>${RK[c.r]}</b><i>${SU[c.s]}</i>`}</span>`};
const tcd=t=>`<span class="tw">${cd(t)}<em class="hi">${t.h.slice(1).map(s=>`<b style="color:${COL[s]}">${SU[s]}</b>`).join('')}</em></span>`;
const bk=n=>`<span class="bk"><img src="${BACK}" alt=""><em>${n}</em></span>`;
const ini=i=>esc((G.P[i].n||'?').trim()[0].toUpperCase());
const chip=i=>`<span class="chip" style="background:${PC[i]}">${ini(i)}</span>`;
const online=i=>S.room.seats[i]&&S.room.seats[i].online;
const isHost=()=>S&&S.room.you==S.room.host;

/* ---------- screens ---------- */
function render(){const app=document.getElementById('app');let h='';
  if(!connected)h+=`<div class="conn">${S?'Connection lost. Reconnecting…':'Connecting to the HUZZAH! server…'}</div>`;
  if(!S)h+=homeHTML();else if(!G)h+=lobbyHTML();else h+=gameHTML();
  app.innerHTML=h;if(G)dragSetup()}

function homeHTML(){const nm=esc(LS.get().name||'');
  return `<div class="home"><h1>HUZZAH!</h1><div style="font-size:13px;opacity:.85">The Tournament of Champions · 2 to 6 players</div>
  <div class="box"><h2>Your name</h2><input id="nm" maxlength="16" placeholder="Name" value="${nm}" autocomplete="nickname" oninput="LS.set({name:this.value})"></div>
  <div class="box"><h2>Join friends</h2><input id="jc" class="code" maxlength="4" placeholder="CODE" value="${esc(jcode)}" oninput="jcode=this.value" autocapitalize="characters" autocomplete="off"><button class="b" onclick="join()">Join game</button></div>
  <div class="box"><h2>Host a game</h2><button class="b" onclick="create()">Create game</button><div class="hint">You'll get a room code to share with friends.</div></div>
  <div class="box"><h2>Practice</h2><div style="font-size:13px;margin-bottom:4px">Players: <select onchange="soloSize=+this.value">${[2,3,4,5,6].map(v=>`<option ${v==soloSize?'selected':''}>${v}</option>`).join('')}</select></div><button class="b ghost" onclick="solo()">Play solo vs bots</button></div>
  <button class="b ghost" style="margin-top:10px" onclick="rules(1)">How to play</button></div>`}

function settingsHTML(edit){const c=S.room.cfg,dis=edit?'':'disabled';
  return `<details ${setOpen?'open':''} ontoggle="setOpen=this.open" class="set"><summary>Playtest settings${edit?'':' (host sets these)'}</summary>
  <label>Noble spots: <select ${dis} onchange="setCfg('nord',this.value)"><option value="desc" ${c.nord=='desc'?'selected':''}>4 / 2 (first claim best)</option><option value="asc" ${c.nord=='asc'?'selected':''}>2 / 4 (last claim best)</option></select></label>
  <label>Nobles in play: <select ${dis} onchange="setCfg('nn',+this.value)">${[0,1,2,3].map(v=>`<option value="${v}" ${v==c.nn?'selected':''}>${v||'Off'}</option>`).join('')}</select></label>
  <label>Secret objectives: <select ${dis} onchange="setCfg('od',+this.value)">${[[0,'Off'],[1,'Deal 1'],[2,'Deal 2, keep 1'],[3,'Deal 3, keep 1']].map(([v,t])=>`<option value="${v}" ${v==c.od?'selected':''}>${t}</option>`).join('')}</select></label>
  <label>Objective refills: <select ${dis} ${c.od?'':'disabled'} onchange="setCfg('rfl',+this.value)">${[[0,'Off'],[1,'Once per player'],[99,'Unlimited']].map(([v,t])=>`<option value="${v}" ${v==c.rfl?'selected':''}>${t}</option>`).join('')}</select></label>
  <label>Win by: <select ${dis} onchange="setCfg('sm',this.value)"><option value="pts" ${c.sm=='pts'?'selected':''}>Points (hand + nobles)</option><option value="hand" ${c.sm=='hand'?'selected':''}>Best hand (nobles break ties)</option></select></label>
  <details><summary>Hand points</summary>${HN.map((n,i)=>`<label style="display:inline-block;margin:2px 8px 2px 0">${n} <input type="number" ${dis} min="0" style="width:46px" value="${c.hp[i]}" onchange="setHP(${i},this.value)"></label>`).join('')}</details>
  <details><summary>Objective points</summary>${OBJ.map((o,i)=>`<label>${o.t} <input type="number" ${dis} min="0" style="width:46px" value="${c.obv[i]}" onchange="setOV(${i},this.value)"></label>`).join('')}</details></details>`}

function lobbyHTML(){const r=S.room,host=isHost(),n=r.seats.length,bots=Math.max(0,r.size-n);
  return `<div class="lob"><div class="topbar"><button class="b sm ghost" onclick="leave()">Leave</button><b>HUZZAH! lobby</b><button class="b sm ghost" onclick="rules(1)">Rules</button></div>
  <div class="box" style="text-align:center"><div class="sec">Room code</div><div class="bigcode">${r.code}</div><button class="b" onclick="invite()">Invite friends</button><div class="wait">Friends open this site, tap Join, and enter the code.</div></div>
  <div class="box"><div class="sec">At the table (${n}/${r.size})</div>${r.seats.map((s,i)=>`<div class="seatl"><span class="chip" style="background:${PC[i]}">${esc(s.name[0].toUpperCase())}</span><span class="nm">${esc(s.name)}${i==r.you?' (you)':''}${i==r.host?' · host':''}</span><span class="dot ${s.online?'':'off'}" title="${s.online?'online':'offline'}"></span>${host&&i!=r.you?`<button class="b sm ghost" onclick="send({t:'kick',seat:${i}})">Remove</button>`:''}</div>`).join('')}
  ${[...Array(bots)].map((_,k)=>`<div class="seatl" style="opacity:.6"><span class="chip" style="background:${PC[n+k]}">🤖</span><span class="nm">Open seat · a bot plays if nobody joins</span></div>`).join('')}
  ${host?`<div style="margin-top:8px;font-size:13px">Table size: <select onchange="send({t:'size',size:+this.value})">${[2,3,4,5,6].filter(v=>v>=Math.max(2,n)).map(v=>`<option ${v==r.size?'selected':''}>${v}</option>`).join('')}</select></div>`:''}</div>
  <div class="box">${settingsHTML(host)}</div>
  ${host?`<button class="b wide" onclick="send({t:'start'})">Start the tournament${bots?` (+${bots} bot${bots>1?'s':''})`:''}</button>`:`<div class="box" style="text-align:center">Waiting for ${esc(r.seats[r.host].name)} to start the game…</div>`}</div>`}

function nobHTML(){if(!G.nobles.length)return'';return `<div class="nobs n${G.nobles.length}">${G.nobles.map((z,ni)=>{const live=G.phase!='end'&&z.n.ev==G.ev;return `<div class="nob ${live?'on':''}" onclick="zoomN(${ni})" title="Tap to enlarge"><img src="${NIMG[z.n.id]}" alt="${z.n.name}"><div class="nbi"><div class="cap"><b>${live?'▶ ':''}${STI[z.n.ev]} ${EV[z.n.ev][0]}</b><br>${z.n.txt}</div><div class="sp">${z.sp.map((x,i)=>`<span class="spt"><i class="${x==null?'':'f'}" ${x==null?'':`style="background:${PC[x]}"`}>${x==null?NV(G)[i]:ini(x)}</i></span>`).join('')}</div></div></div>`}).join('')}</div>`}
function zoom(id,src,extra){let d=document.getElementById('zoom');if(!d){d=document.createElement('div');d.id='zoom';d.onclick=()=>{d.style.display='none'};document.body.appendChild(d)}d.innerHTML=`<img src="${src||NIMG[id]}">${extra||''}`;d.style.display='flex'}
function zoomN(ni){const z=G.nobles[ni],n=z.n,live=G.phase!='end'&&n.ev==G.ev;zoom(null,NIMG[n.id],`<div class="zt"><b>${n.name}</b>${live?' · <span style="color:var(--ac)">▶ this event</span>':''}<div>${STI[n.ev]} ${EV[n.ev][0]}</div><p>${n.txt}</p><div class="zs">${z.sp.map((x,i)=>`<span><b>${NV(G)[i]} pts</b> · ${x==null?'open':esc(G.P[x].n)}</span>`).join('')}</div><small>Tap anywhere to close</small></div>`)}
function zoomO(id){zoom(null,OIMG[id])}

function obHTML(){const g=G,h0=myP();if(!g.cfg.obon||g.phase=='end'||!h0.oc||!h0.oc.length||g.cfg.od<2)return'';const ch=(!g.hist.length&&!h0.rf)||h0.ob==null;if(!ch)return'';
  return `<div class="obs"><div class="sec">${h0.rf?'New secret objective':'Secret objective'}: tap the one to keep${h0.ob!=null?' (you can switch until the first reveal)':''}</div><div class="obrow">${h0.oc.map((o,k)=>`<div class="ob ${h0.ob==o?'sel':''}" onclick="pickObj(${k})"><img src="${OIMG[OBJ[o].id]}" alt="${OBJ[o].t}"><small>+${obv(g,o)}</small></div>`).join('')}</div></div>`}
function obChip(){const g=G,h0=myP();if(!g.cfg.obon)return'';const d=(h0.done||[]).length,dn=d?`<small class="obd" title="Completed objectives">✓${d} +${h0.done.reduce((a,o)=>a+obv(g,o),0)}</small>`:'';if(h0.ob==null)return dn;const o=OBJ[h0.ob],a=ach(g,o,g.me);return `<span class="obc ${a?'ok':''}" onclick="zoomO('${o.id}')" title="${o.t}"><img src="${OIMG[o.id]}" alt="${o.t}"><b>+${obv(g,h0.ob)}${a?' ✓':''}</b></span>${dn}`}

function arenaHTML(T){const g=G,e=EV[g.ev],ph=g.phase,k=e[1],me=g.me,host=isHost();
  const sch=`<div class="sch2"><div></div>${EV.map((x,i)=>`<div class="sce ${i==g.ev?'on':''}">${STI[i]}<small>${x[0]}</small></div>`).join('')}${[0,1,2,3].map(w=>`<div class="scd ${w==g.wave?'on':w<g.wave?'done':''}">D${w+1}</div>${EV.map((x,i)=>{const tr=g.trs[w*5+i],hw=g.hist.find(z=>z.w==w&&z.e==i);if(w>g.wave)return `<div class="sct hid">?</div>`;return `<div class="sct ${w==g.wave&&i==g.ev?'cur':''} ${hw?'won':''}" style="background:${COL[tr.s]}">${RK[tr.r]}${SU[tr.s]}${hw?`<i style="background:${PC[hw.win]}"></i>`:''}</div>`}).join('')}`).join('')}</div>`;
  const lane=i=>{const p=g.P[i],off=!p.bot&&!online(i);let cs='',lh='';
   if(ph=='show'){cs=p.pl.map(c=>cd(c,'flip')).join('');lh=hname(g.ks[i],g.ev)}
   else{cs=p.locked||p.bot?Array(k).fill(`<span class="bk big"><img src="${BACK}" alt=""></span>`).join(''):Array(k).fill('<span class="c ph"></span>').join('');lh=p.bot?'':p.locked?'locked ✓':off?'offline':'choosing…'}
   const win=ph=='show'&&i==g.win;
   return `<div class="lane ${win?'win':''} ${off?'off':''}" style="--pc:${PC[i]}"><div class="ln">${chip(i)}<b>${esc(p.n)}</b>${p.bot?'🤖':''}${win?'🏆':''}<span class="lst">${g.cfg.nn?npts(g,i)+'★ ':''}${bk(p.hc)}</span></div><div class="lc">${cs}</div>${lh?`<div class="lh">${lh}</div>`:''}<div class="row trow">${[...p.tr].sort((a,b)=>b.r-a.r||a.s-b.s).map(t=>cd(t)).join('')}</div>${host&&off&&ph!='end'?`<button class="b sm" onclick="send({t:'botify',seat:${i}})">Let a bot play</button>`:''}</div>`};
  const others=g.P.map((_,i)=>(me+1+i)%g.n).slice(0,g.n-1);
  return `<div class="arena">${sch}<div class="lanes" style="grid-template-columns:repeat(${others.length},minmax(0,1fr))">${others.map(lane).join('')}</div>
  <div class="lists"><div class="tro1">${tcd(T)}<small>${STI[g.ev]} ${e[0]} · D${g.wave+1}</small></div><div class="cm"><div class="sec">Community</div><div class="row">${[0,1,2,3,4].map(i=>g.comm[i]?cd(g.comm[i]):'<span class="c ph"></span>').join('')}</div></div></div>
  ${ph=='show'?g.nlog.map(t=>`<div class="nl">👑 ${esc(t)}</div>`).join('')+(g.olog||[]).map(t=>`<div class="nl">🎯 ${esc(t)}</div>`).join(''):''}</div>`}

function gameHTML(){const g=G,e=EV[g.ev],ph=g.phase,me=g.me,h0=g.P[me],T=TRO(g),host=isHost(),k=e[1],nob=needOb(g,h0);let st='',wait='';
  const names=f=>g.P.map((p,i)=>i).filter(i=>i!=me&&!g.P[i].bot&&f(i)).map(i=>esc(g.P[i].n));
  if(ph=='pick'){
    if(nob)st=g.hist.length?'Pick your new secret objective':'Choose your secret objective first';
    else if(h0.sel){st='Locked in → '+hname(best(selCards().concat(g.comm)),g.ev);const w=names(i=>!g.P[i].locked);wait=w.length?'Waiting for '+w.join(', '):''}
    else{const sc=selCards(),full=sc.length==k,nm=full?g.nobles.filter(z=>z.n.ev==g.ev&&nq(z.n,sc,g.comm)).map(z=>'✓ '+z.n.name):[];
     st=`Choose ${k} card${k>1?'s':''} (${sc.length}/${k})`+(full?' → '+hname(best(sc.concat(g.comm)),g.ev)+(nm.length?' · '+nm.join(', '):''):'')}}
  if(ph=='show'){st=`${g.win==me?'You win':esc(g.P[g.win].n)+' wins'} the trophy!`;if(h0.cont){const w=names(i=>!g.P[i].cont&&online(i));wait=w.length?'Waiting for '+w.join(', '):''}}
  if(ph=='end')st='Tournament over!';
  const tro=p=>[...p.tr].sort((a,b)=>b.r-a.r||a.s-b.s);
  let h=`<div class="topbar"><button class="b sm ghost" onclick="leave()">Leave</button><b class="ttl">HUZZAH!</b><span>Room <b>${S.room.code}</b> <button class="b sm ghost" onclick="rules(1)">Rules</button></span></div>`;
  h+=nobHTML();
  if(ph!='end')h+=arenaHTML(T);
  else{const r=ranking(g),sm=g.cfg.sm;
   h+=`<div class="box"><b>Winner: ${esc(r[0].p.n)}!</b> HUZZAH!${r.map((x,i)=>{const d=(x.p.done||[]).length+(x.p.ob!=null&&ach(g,OBJ[x.p.ob],x.i)?1:0),ob=g.cfg.obon?` · objective${d>1?'s':''} ${d?'✓'.repeat(d)+' +'+obp(g,x.i):'✗'}`:'';return `<div class="res ${i?'':'win'}"><b>${i+1}. ${esc(x.p.n)}</b> ${bestCards(x.p.tr).map(c=>cd(c)).join('')} <span>${x.p.tr.length?HN[best(x.p.tr)[0]]:'No trophies'} +${hpts(g,x.p)} · nobles +${npts(g,x.i)}${ob} = <b>${hpts(g,x.p)+npts(g,x.i)+obp(g,x.i)}</b></span></div>`}).join('')}<i>${sm=='pts'?'Total = hand points + noble points + secret objectives. Ties: better hand, then suit order on the last trophy.':'Best hand wins. Ties: noble points, then suit order on the last trophy.'}</i></div>`}
  let cs='',lh='';
  if(ph=='show'){cs=h0.pl.map(c=>cd(c,'flip')).join('');lh=hname(g.ks[me],g.ev)}
  else if(ph=='pick'){const sc=selCards();cs=sc.map(c=>cd(c,'land',h0.sel?'':`pick(${order.indexOf(ck(c))})`)).join('')+Array(k-sc.length).fill('<span class="c ph"></span>').join('')}
  let btn='';
  if(ph=='pick')btn=h0.sel?`<button class="b" onclick="unlock()">Change</button>`:`<button class="b" onclick="lockIn()" ${sel.length==k&&!nob?'':'disabled'}>Lock in</button>`;
  if(ph=='show')btn=h0.cont?`<button class="b" disabled>Waiting…</button>`:`<button class="b" onclick="cont()">${g.ev==4?(g.wave==3?'Final scores':'Next day'):'Continue'}</button>`;
  if(ph=='end')btn=host?`<button class="b" onclick="send({t:'again'})">Play again</button><button class="b ghost" onclick="send({t:'lobby'})">Lobby</button>`:`<button class="b ghost" onclick="leave()">Leave</button>`;
  const win=ph=='show'&&g.win==me;
  h+=`<div class="you ${win?'win':''}" style="--pc:${PC[me]}"><div class="yl"><div class="ln">${chip(me)}<b>You</b>${win?'🏆':''}<span class="lst">${h0.tr.length}🏆${g.cfg.nn?' '+npts(g,me)+'★':''}</span></div><div id="st">${st}${wait?`<div class="wait">${wait}</div>`:''}${ph=='end'&&!host?'<div class="wait">The host can start a rematch.</div>':''}</div><div class="row trow">${tro(h0).map(tcd).join('')}</div></div>${ph!='end'?`<div class="ymid"><div class="lc">${cs}</div>${lh?`<div class="lh">${lh}</div>`:''}</div>`:''}<div class="yb">${obChip()}${btn}</div></div>`;
  if(ph!='end'){const hid=nob&&!g.hist.length;
   if(hid)h+=`<div class="sec">Hand hidden until you pick an objective</div><div class="row hand">${h0.hand.map(()=>`<span class="c art"><img src="${BACK}" alt=""></span>`).join('')}</div>`;
   else h+=`<div class="sec hs">Your hand · drag to rearrange <button class="b rb" onclick="sortHand()">Sort</button></div><div class="row hand">${handCards().map((c,i)=>cd(c,'hd'+(sel.includes(ck(c))?' sel':''),ph=='pick'&&!h0.sel?`pick(${i})`:'')).join('')}</div>`}
  h+=obHTML();
  return h}

function rules(o){let d=document.getElementById('rules');if(!d){d=document.createElement('div');d.id='rules';document.body.appendChild(d)}d.innerHTML=o?`<div class="rp"><button class="b" onclick="rules(0)">Close</button>${RULES}${ONLINE_RULES}</div>`:'';d.style.display=o?'block':'none'}
let dragAt=0;
function reorder(i,j){const [k]=order.splice(i,1);order.splice(j,0,k);render()}
function sortHand(){const p=myP(),m={};p.hand.forEach(c=>m[ck(c)]=c);order.sort((a,b)=>HZ.srt(m[a],m[b]));render()}
function dragSetup(){const row=document.querySelector('.hand');if(!row)return;
 [...row.children].forEach((el,i)=>{el.style.touchAction='none';
  el.onpointerdown=e=>{const x0=e.clientX;let mv=false;
   const m=ev=>{const dx=ev.clientX-x0;if(!mv&&Math.abs(dx)>8){mv=true;try{el.setPointerCapture(e.pointerId)}catch(_){}el.style.zIndex=9}if(mv)el.style.transform='translate('+dx+'px,-16px)'};
   const u=ev=>{el.removeEventListener('pointermove',m);el.removeEventListener('pointerup',u);el.removeEventListener('pointercancel',u);
    if(!mv)return;dragAt=Date.now();const cx=ev.clientX;let j=0;[...row.children].forEach((k,n)=>{if(n!=i){const r=k.getBoundingClientRect();if(r.left+r.width/2<cx)j++}});reorder(i,j)};
   el.addEventListener('pointermove',m);el.addEventListener('pointerup',u);el.addEventListener('pointercancel',u)}})}
render();connect();
</script></body></html>
