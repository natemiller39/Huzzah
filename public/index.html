</style></head><body><div id="app"></div>

<script>
const {SU,COL,RK,EV,HN,OBJ,cmp,best,bestCards,hname,nq,NV,TRO,npts,hpts,ach,obv,obp,needOb,ranking}=HZ;
const PC=['#ffd24a','#ff6b6b','#5bc0ff','#7be07b','#c58cff','#ffa94d'],STI=['🏹','⚔️','🐎','🛡️','🏅'];
const RULES=`<h2>HUZZAH! The Tournament of Champions</h2><p><i>A poker-inspired card game of timing and hand management. 2 to 6 players.</i></p><p><b>5 or 6 players:</b> the Yellow ✦ suit is added to the playing deck (65 cards), and Yellow appears in every suit tie-break order. The rules are otherwise the same.</p><h3>Goal</h3><p>Win trophy cards across four waves and claim spots on noble cards. At the end your best five-card trophy hand scores points, and your noble points are added.</p><h3>Setup</h3><p>Wave 1: each player gets 10 hidden cards from a 52-card deck. The 20 trophy cards (10, J, Q, K, A in four suits) are set out by event: <b>Archery awards the 10, Sword Fight the Jack, Joust the Queen, Grand Melee the King, and Champion the Ace</b>. Every rank appears once in each suit, and the suits are shuffled across the four days at the start, so each day's trophies are a mix of suits. The field shows the trophies for the current day and past days; future days stay hidden until they start. Two noble cards are dealt face-up, each with a different event and a different objective.</p><h3>A wave: five events</h3><ol><li><b>Archery:</b> play 2 cards (your pocket), compare the 2-card hands.</li><li><b>Sword Fight:</b> 3 community cards. Play 2; best 5 from your 2 + the board.</li><li><b>Joust:</b> 4th community card. Play 2; best 5 of 6.</li><li><b>Grand Melee:</b> 5th community card. Play 2; best 5 of 7.</li><li><b>Champion:</b> play 1 card. Only what your card makes with the community cards counts: a pair with one of them, three of a kind if it matches a pair there, four of a kind if it matches three. Otherwise your card's rank is your hand. A pair already among the community cards doesn't help anyone, and straights and flushes don't count.</li></ol><p>The winner of each event takes its trophy. You play 9 cards a wave, so <b>one card is left over and you keep it</b> for the next wave: each new wave you are dealt 9 fresh cards to join it (no duplicates). Choose carefully what to hold back.</p><h3>Nobles</h3><p>Each noble card has an event, an objective, and 2 spots worth 3 and 2 points (the first claim gets 3). When that event is played, the single player whose pocket (the card or cards they play) best meets the objective places a token on the next open spot (the 3 first). It happens in addition to the trophy, so one player can win both. If nobody qualifies, nothing is claimed. When both spots are full, the noble is exhausted and a new one is dealt, always with an event and an objective not already used by the other noble.</p><ul><li><b>Lowest pair:</b> your 2 cards are a pair; the lowest pair wins.</li><li><b>Biggest gap:</b> the largest rank difference between your 2 cards.</li><li><b>Number cards adding to 10:</b> two cards from 2 to 10 that add up to 10 (8+2, 7+3, 6+4, 5+5); the highest card wins.</li><li><b>Highest consecutive:</b> two cards of consecutive ranks; the highest top card wins.</li><li><b>Highest Spade / Heart, Lowest Diamond:</b> among your pocket cards of that suit.</li><li><b>Best 3-card straight:</b> any three consecutive ranks among your pocket + the community cards, using one or two of your pocket cards (at least one); the highest straight wins.</li></ul><p>Ties on a noble: compare the suits of your qualifying cards, highest rank first, using the suit order printed on the noble (top is best; Yellow is skipped when it isn't in play). For a 3-card straight, all three cards of the straight count.</p><h3>Secret objectives</h3><p>At the start each player is dealt 2 objective cards and keeps 1 secret (you can switch until the first reveal). Your hand stays face down until you've picked. An objective is met if you win the described event: by wave (day 1 or 3 means either wave 1 or wave 3), or with the described hand. Poker-hand objectives use the winning five-card hand in that event. Met objectives score their points at the end. Bots keep a random one. The host can turn objectives off in Playtest settings.</p><p><b>Variant, objective refills</b> (Playtest settings): when you complete your objective it scores right away and you're dealt new ones (same number as the starting deal) and keep 1. You only get objectives that can still be won, and only events after you take it count. <i>Once per player</i> allows one refill; <i>Unlimited</i> refills every time.</p><p><b>Setup options:</b> the host can set how many nobles are in play (0 to 3) and how many objectives each player is dealt (0 to 3) in Playtest settings.</p><h3>Final scoring</h3><p>After wave 4, choose your best five trophy cards (normal poker). Score = <b>hand points + noble points + your secret objective(s)</b>. Hand points (provisional): high card 0, pair 2, two pair 4, three of a kind 6, straight 8, flush 10, full house 12, four of a kind 14, straight flush 16, royal flush 18. The highest total wins. The host can switch to "best hand wins, nobles only break ties" in Playtest settings. Further ties: better hand, then the suit order on the last trophy.</p><h3>Tie-breaks in an event</h3><p>Every trophy has its own suit order, starting with its own suit. For exactly tied hands in an event, compare the suits of the played cards, highest rank first, using that trophy's order.</p><h3>Playtest build notes</h3><ul><li>Archery: a pair beats no pair, then high cards.</li><li>Bots save strong cards for later events and go for nobles when they can.</li><li>Ace counts high only for straights and consecutive pairs (except the 3-card wheel A-2-3).</li><li>Tap a noble to enlarge it and read its card. Tap your objective chip to see your objective.</li><li>Tap <b>📊</b> next to your trophies (or <b>Scores</b> at the top) for the score chart and current standings.</li></ul>`;
const ONLINE_RULES=`<h3>Playing online</h3><ul><li><b>Create a game</b> to get a 4-letter room code, then share the code or the invite link. Friends tap <b>Join</b> and enter it.</li><li>The host picks the table size (2 to 6). Empty seats are filled with bots when the host starts.</li><li>Everyone chooses cards at the same time and taps <b>Lock in</b>. You can change your cards until the last player locks in; then all cards are revealed together.</li><li>After each reveal everyone taps <b>Continue</b>; the next event starts when all connected players are ready.</li><li>If you lose connection, just reopen the page: you'll rejoin your seat. If a friend leaves for good, the host can hand their seat to a bot.</li></ul>`;

/* ---------- local state ---------- */
const LS={get(){try{return JSON.parse(localStorage.getItem('hz')||'{}')}catch(_){return {}}},set(v){try{localStorage.setItem('hz',JSON.stringify(Object.assign(LS.get(),v)))}catch(_){}},del(k){try{const o=LS.get();delete o[k];localStorage.setItem('hz',JSON.stringify(o))}catch(_){}}};
let S=null,G=null,ws=null,connected=false,wantRoom=null,order=[],sel=[],toastT=0,homeMode=null,setOpen=false,soloSize=4;
const soloCfg=Object.assign({nn:2,od:2,rfl:0},LS.get().solo||{});
function setSolo(k,v){soloCfg[k]=v;LS.set({solo:soloCfg});render()}
const qs=new URLSearchParams(location.search);const inviteCode=(qs.get('room')||'').toUpperCase().slice(0,4);
let jcode=inviteCode;
const ck=c=>c.s+'-'+c.r;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- connection ---------- */
let retry=0;
function connect(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{connected=true;retry=0;const s=LS.get();if(s.code&&s.token)send({t:'rejoin',code:s.code,token:s.token});render()};
  ws.onclose=()=>{connected=false;render();setTimeout(connect,Math.min(8000,600*(++retry)))};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t=='joined'){LS.set({code:m.code,token:m.token});history.replaceState(null,'',location.pathname)}
    else if(m.t=='state'){if(TUT)return;S=m;G=m.g;syncHand();render()}
    else if(m.t=='error')toast(m.msg);
    else if(m.t=='gone'){LS.del('code');LS.del('token');S=null;G=null;render()}
    else if(m.t=='kicked'){LS.del('code');LS.del('token');S=null;G=null;toast(m.msg);render()}};
}
const send=m=>{if(TUT)return tutSend(m);if(ws&&ws.readyState==1)ws.send(JSON.stringify(m));else toast('Still connecting… try again in a moment.')};
function toast(t){let d=document.getElementById('toast');if(!d){d=document.createElement('div');d.id='toast';d.className='toast';document.body.appendChild(d)}d.textContent=t;d.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>d.style.display='none',3500)}

/* ---------- my hand (local order + selection) ---------- */
function myP(){return G&&G.P[G.me]}
function syncHand(){const p=myP();if(!p||!p.hand){order=[];sel=[];return}
  const ks=p.hand.map(ck);order=order.filter(k=>ks.includes(k)).concat(ks.filter(k=>!order.includes(k)));
  if(p.sel)sel=p.sel.map(ck);else sel=sel.filter(k=>ks.includes(k));
  if(G.phase!='pick')sel=[]}
const handCards=()=>{const p=myP(),m={};p.hand.forEach(c=>m[ck(c)]=c);return order.map(k=>m[k])};
const selCards=()=>{const p=myP(),m={};p.hand.forEach(c=>m[ck(c)]=c);return sel.map(k=>m[k]).filter(Boolean)};

/* ---------- actions ---------- */
function myName(){const v=(document.getElementById('nm')||{}).value;const n=(v!=null?v:LS.get().name||'').trim();if(v!=null)LS.set({name:n});return n}
function create(){const n=myName();if(!n)return needName();send({t:'create',name:n})}
function solo(){const n=myName()||'You';send({t:'solo',name:n,size:soloSize,cfg:soloCfg})}
function join(){const n=myName();if(!n)return needName();const c=(document.getElementById('jc').value||'').trim().toUpperCase();if(c.length!=4)return toast('Enter the 4-letter room code.');send({t:'join',code:c,name:n})}
function needName(){toast('Enter your name first.');const e=document.getElementById('nm');if(e)e.focus()}
function leave(){if(TUT)return exitTut();if(G&&G.phase!='end'&&!confirm('Leave this game? A bot will take over your seat.'))return;send({t:'leave'});LS.del('code');LS.del('token');S=null;G=null;render()}
function pick(i){if(Date.now()-dragAt<400||!G||G.phase!='pick')return;if(TUT&&!tutMayTap(order[i]))return;const p=myP();if(p.sel||needOb(G,p))return;const k=order[i],j=sel.indexOf(k);if(j>=0)sel.splice(j,1);else if(sel.length<EV[G.ev][1])sel.push(k);render()}
function lockIn(){if(sel.length!=EV[G.ev][1])return;send({t:'play',cards:selCards().map(c=>({s:c.s,r:c.r}))})}
function unlock(){send({t:'unplay'})}
const vw=()=>Math.min(document.documentElement.clientWidth||innerWidth,screen&&screen.width?screen.width:9999,innerWidth);
let obOpen=false;
function pickObj(k){obOpen=false;send({t:'obj',k});render()}
function canSwitchOb(){const h0=myP();return G&&G.phase=='pick'&&!G.hist.length&&!h0.rf&&h0.ob!=null&&h0.oc&&h0.oc.length>1}
function cont(){send({t:'cont'})}
function setCfg(k,v){const c={};c[k]=v;send({t:'cfg',cfg:c})}
function setHP(i,v){const a=S.room.cfg.hp.slice();a[i]=+v||0;setCfg('hp',a)}
function setOV(i,v){const a=S.room.cfg.obv.slice();a[i]=+v||0;setCfg('obv',a)}
function invite(){const url=location.origin+'/?room='+S.room.code,txt='Join my HUZZAH! game. Room code '+S.room.code;
  if(navigator.share)navigator.share({title:'HUZZAH!',text:txt,url}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt+': '+url).then(()=>toast('Invite link copied'),()=>prompt('Copy this link',url));
  else prompt('Copy this link',url)}

/* ---------- card drawing ---------- */
const cd=(c,cls='',oc='')=>{const k=ck(c),a=ART[k]||(c.s==4?NIMG[k]:null);return `<span class="c ${a?'art':''} ${cls}${oc?' tap':''}" style="color:${COL[c.s]}" ${oc?`onclick="${oc}"`:''}>${a?`<img src="${a}" alt="${RK[c.r]}${SU[c.s]}"><em class="ix">${RK[c.r]}<br>${SU[c.s]}</em>`:`<b>${RK[c.r]}</b><i>${SU[c.s]}</i>`}</span>`};
const tcd=t=>`<span class="tw">${cd(t)}<em class="hi">${t.h.slice(1).map(s=>`<b style="color:${COL[s]}">${SU[s]}</b>`).join('')}</em></span>`;
const bk=n=>`<span class="bk"><img src="${BACK}" alt=""><em>${n}</em></span>`;
const ini=i=>esc((G.P[i].n||'?').trim()[0].toUpperCase());
const chip=i=>`<span class="chip" style="background:${PC[i]}">${ini(i)}</span>`;
const online=i=>S.room.seats[i]&&S.room.seats[i].online;
const isHost=()=>S&&S.room.you==S.room.host;

/* ---------- screens ---------- */
/* fit the game screen to the visible screen: shrink the table first, then scale everything if needed */
let FIT_SHRINK=0;
const viewH=()=>Math.min(innerHeight,window.visualViewport?visualViewport.height:innerHeight);
function buildHTML(){let h='';
  if(!connected&&!TUT)h+=`<div class="conn">${S?'Connection lost. Reconnecting…':'Connecting to the HUZZAH! server…'}</div>`;
  if(!S)h+=homeHTML();else if(!G)h+=lobbyHTML();else h+=gameHTML();return h}
/* keep my played cards clear of the trophy + community row: lift the row into free space, then make the table taller (fit-to-screen zooms if needed) */
function fixTable(){const t=document.querySelector('.tbl'),me=t&&t.querySelector('.spot.me .cs'),c=t&&t.querySelector('.ctr');if(!me||!c)return;
  const R=e=>e.getBoundingClientRect(),parts=[...c.querySelectorAll('.tro1,.cm .row')].map(R);if(!parts.length)return;
  const U={l:Math.min(...parts.map(r=>r.left)),r:Math.max(...parts.map(r=>r.right)),t:Math.min(...parts.map(r=>r.top)),b:Math.max(...parts.map(r=>r.bottom))};
  let lim=R(t).top+6;t.querySelectorAll('.pseat,.spot:not(.me),.deckpile').forEach(e=>{const r=R(e);if((r.top+r.bottom)/2<U.t&&r.right>U.l&&r.left<U.r)lim=Math.max(lim,r.bottom+4)});
  const dn=Math.ceil(lim-U.t);if(dn>0){c.style.top=(parseFloat(c.style.top)+dn)+'px';U.t+=dn;U.b+=dn;const sp=me.parentNode;sp.style.top=(parseFloat(sp.style.top)+dn)+'px';t.style.height=(parseFloat(t.style.height)+dn)+'px'}
  let over=Math.max(U.b,R(c).bottom)+6-R(me).top;if(over<=0)return;
  const up=Math.min(over,Math.max(0,Math.floor(U.t-lim)));if(up){c.style.top=(parseFloat(c.style.top)-up)+'px';over-=up}
  if(over>0){const sp=me.parentNode;over=Math.ceil(over);sp.style.top=(parseFloat(sp.style.top)+over)+'px';t.style.height=(parseFloat(t.style.height)+over)+'px'}}
/* the reveal moment: a big WINNER next to the event winner and a big crown next to each noble winner, then they fade away */
let lastReveal='';
function revealPops(){if(!G||G.phase!='show')return;const key=G.wave+'-'+G.ev+'-'+G.hist.length;if(key==lastReveal)return;lastReveal=key;
  document.querySelectorAll('.rpop,.rshade').forEach(e=>e.remove());
  const at=i=>{const e=document.querySelector(`[data-p="${i}"]`);if(!e)return null;const r=e.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,r}};
  const add=(cls,html,x,y)=>{const d=document.createElement('div');d.className='rpop '+cls;d.innerHTML=html;
    d.style.left=Math.max(110,Math.min(innerWidth-110,x))+'px';d.style.top=Math.max(cls=='win'?100:60,Math.min(innerHeight-(cls=='win'?100:60),y))+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),4000)};
  const sh=document.createElement('div');sh.className='rshade';document.body.appendChild(sh);setTimeout(()=>sh.remove(),4000);
  const w=at(G.win);if(w){const P=G.P[G.win],hd=handDesc(P.pl,G.ks[G.win],G.ev);add('win',`<div class="rib"><i>🏆</i>${G.win==G.me?'You win!':'Winner'}</div><div class="rwc"><div class="rcs">${P.pl.map(c=>cd(c)).join('')}</div><b>${G.win==G.me?'':esc(P.n)+': '}${hd.charAt(0).toUpperCase()+hd.slice(1)}</b></div>`,w.x,w.y)}
  const by={};(G.ncl||[]).forEach(c=>by[c.p]=(by[c.p]||0)+c.v);

  let seats='',spots='';

function scoreHTML(){const g=G,me=g.me,hk=p=>p.tr.length?best(p.tr)[0]:-1,mine=hk(g.P[me]),hp=g.cfg.hp;
